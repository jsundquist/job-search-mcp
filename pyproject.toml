[project]
name = "job-search-mcp"
version = "0.1.0"
description = "MCP server for job-description fit analysis via RAG over a resume/experience corpus, with pluggable vector store, tracking store, and resume source adapters."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=2.0.0",
    "pypdf>=6.14.2",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
    "qdrant-client>=1.18.0",
    "sentence-transformers>=5.6.1",
]

[project.scripts]
job-search-mcp = "job_search_mcp.server:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/job_search_mcp"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a live Qdrant instance (set QDRANT_URL, see .env.example)"]
addopts = "-m 'not integration'"
